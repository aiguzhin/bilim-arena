databases:
  - name: bilim-arena-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: bilim-arena
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/subjects
    envVars:
      # База данных — Neon (бесплатно, бессрочно). Строка подключения задаётся вручную в панели Render.
      - key: DATABASE_URL
        sync: false
