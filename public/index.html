<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilim Arena — подготовка к ЕНТ в дуэлях</title>
<meta name="description" content="Соревнуйся с одноклассниками в вопросах ЕНТ: дуэли один на один, класс против класса, рейтинг школ и разбор ошибок.">
<meta property="og:title" content="Bilim Arena — баттл по ЕНТ">
<meta property="og:description" content="Тебя вызвали на дуэль по ЕНТ. 10 вопросов, 20 секунд на ответ.">
<meta name="theme-color" content="#0E2552">
<script>
  // Тема и оформление применяются до отрисовки, чтобы страница не мигала.
  (function () {
    var d = document.documentElement, g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    d.dataset.theme = g('ba_theme') || 'system';
    d.dataset.accent = g('ba_accent') || 'classic';
    d.dataset.fs = g('ba_fs') || 'md';
  })();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="wrap top__in">
    <a href="/" class="logo" data-link aria-label="Bilim Arena — на главную">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0E2552"/><path d="M9 23 L16 9 L23 23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.8 18h8.4" stroke="#F2B600" stroke-width="3" stroke-linecap="round"/></svg>
      <span>Bilim Arena</span>
    </a>
    <nav class="nav" id="mainNav">
      <a href="/ent" data-link class="nav__ent auth-only" data-i18n="navEnt">Пробный ЕНТ</a>
      <a href="/rating" data-link class="nav__rating auth-only" data-i18n="navRating">Рейтинг</a>
      <a href="/tournaments" data-link class="nav__tours auth-only" data-i18n="navTours">Турниры</a>
      <div class="lang-seg" id="langSeg" role="radiogroup" aria-label="Тіл / Язык">
        <span class="lang-seg__thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-lang="kk">Қаз</button>
        <button type="button" role="radio" data-lang="ru">Рус</button>
      </div>
      <button class="profile-chip" id="profileChip" hidden></button>
      <button class="menu-btn auth-only" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel" data-i18n-aria="menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a href="/play" data-link class="btn btn--sm auth-only" data-i18n="navPlay">Играть</a>
    </nav>
  </div>
</header>

<div class="menu" id="menuPanel" hidden>
  <div class="menu__scrim" data-close></div>
  <nav class="menu__panel" aria-label="Меню">
    <div class="menu__user" id="menuUser"></div>
    <div class="menu__list" id="menuList"></div>
    <div class="menu__theme" id="menuTheme"></div>
  </nav>
</div>

<main id="app"></main>
<nav class="tabbar auth-only" id="tabbar" aria-label="Разделы">
  <a href="/" data-link data-tab="home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="tbHome">Главная</span></a>
  <a href="/ent" data-link data-tab="ent"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg><span data-i18n="tbEnt">ЕНТ</span></a>
  <a href="/play" data-link data-tab="play" class="tabbar__main"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg></i><span data-i18n="tbPlay">Играть</span></a>
  <a href="/tournaments" data-link data-tab="tours"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg><span data-i18n="tbTours">Турниры</span></a>
  <a href="/rating" data-link data-tab="rating"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span data-i18n="tbRating">Рейтинг</span></a>
</nav>

<dialog id="profileDlg" class="dlg">
  <form method="dialog" id="profileForm" class="dlg__body">
    <h2 data-i18n="dlgTitle"></h2>
    <p class="muted" data-i18n="dlgLead"></p>
    <label class="field"><span data-i18n="fName"></span><input name="name" maxlength="24" required minlength="2" autocomplete="nickname" data-i18n-ph="fNamePh"></label>
    <label class="field"><span data-i18n="fCity"></span><select name="city" required id="citySelect"></select></label>
    <label class="field"><span data-i18n="fSchool"></span><input name="school" maxlength="60" required data-i18n-ph="fSchoolPh"></label>
    <p class="form-error" id="profileError" role="alert"></p>
    <div class="dlg__actions">
      <button type="button" class="btn btn--ghost" id="profileCancel" data-i18n="cancel"></button>
      <button class="btn" type="submit" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/ent.js"></script>
<script src="/account.js"></script>
<script src="/edu.js"></script>
<script src="/app.js"></script>
</body>
</html>
