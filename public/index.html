<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilim Arena — подготовка к ЕНТ в дуэлях</title>
<meta name="description" content="Соревнуйся с одноклассниками в вопросах ЕНТ: дуэли один на один, класс против класса, рейтинг школ и разбор ошибок.">
<meta property="og:title" content="Bilim Arena — баттл по ЕНТ">
<meta property="og:description" content="Тебя вызвали на дуэль по ЕНТ. 10 вопросов, 20 секунд на ответ.">
<meta name="theme-color" content="#0E2552">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="wrap top__in">
    <a href="/" class="logo" data-link aria-label="Bilim Arena — на главную">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0E2552"/><path d="M9 23 L16 9 L23 23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.8 18h8.4" stroke="#F2B600" stroke-width="3" stroke-linecap="round"/></svg>
      <span>Bilim Arena</span>
    </a>
    <nav class="nav" id="mainNav">
      <a href="/rating" data-link class="nav__rating auth-only" data-i18n="navRating">Рейтинг</a>
      <a href="/about" data-link class="hide-sm auth-only" data-i18n="navAbout">О проекте</a>
      <div class="lang-seg" id="langSeg" role="radiogroup" aria-label="Тіл / Язык">
        <span class="lang-seg__thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-lang="kk">Қаз</button>
        <button type="button" role="radio" data-lang="ru">Рус</button>
      </div>
      <button class="profile-chip" id="profileChip" hidden></button>
      <a href="/play" data-link class="btn btn--sm auth-only" data-i18n="navPlay">Играть</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<dialog id="profileDlg" class="dlg">
  <form method="dialog" id="profileForm" class="dlg__body">
    <h2 data-i18n="dlgTitle"></h2>
    <p class="muted" data-i18n="dlgLead"></p>
    <label class="field"><span data-i18n="fName"></span><input name="name" maxlength="24" required minlength="2" autocomplete="nickname" data-i18n-ph="fNamePh"></label>
    <label class="field"><span data-i18n="fCity"></span><select name="city" required id="citySelect"></select></label>
    <label class="field"><span data-i18n="fSchool"></span><input name="school" maxlength="60" required data-i18n-ph="fSchoolPh"></label>
    <p class="form-error" id="profileError" role="alert"></p>
    <div class="dlg__actions">
      <button type="button" class="btn btn--ghost" id="profileCancel" data-i18n="cancel"></button>
      <button class="btn" type="submit" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
